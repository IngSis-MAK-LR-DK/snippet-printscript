services:
  snippet-printscript:
    build:
      context: .
      secrets:
        - gpr_user
        - gpr_key
    environment:
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
    ports:
      - "${SERVICE_PORT}:8080"

secrets:
  gpr_user:
    environment: GPR_USER
  gpr_key:
    environment: GPR_KEY
